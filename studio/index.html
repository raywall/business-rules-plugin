<!doctype html>
<html lang="pt-BR">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-M75S9C0W4B"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-M75S9C0W4B');
  </script>

  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Business Rules Studio: editor YAML para simular regras de negocio." />
  <title>Business Rules Studio</title>

  <link rel="stylesheet" href="../plugin/process-plugin.css">
  <link rel="stylesheet" href="./style.css" />
  <link rel="icon" href="data:,">
  <link rel="icon" href="./favicon.png" type="image/x-icon" />
</head>

<body>

  <!-- ═══════════════════════════════════════════════
     SIDEBAR
     ═══════════════════════════════════════════════ -->
  <aside class="studio-sidebar" aria-label="Editor de regras">

    <header class="sidebar-header">
      <div class="sidebar-title">
        <p class="eyebrow">Business Rules</p>
        <h1>Studio</h1>
      </div>
    </header>

    <!-- ─── Workspace panel (NEW) ─── -->
    <div class="ws-panel" id="workspacePanel">

      <div class="ws-toolbar">
        <span class="ws-label" id="workspaceName">Workspace</span>
        <div class="ws-toolbar-actions">
          <!-- Novo usecase no serviço ativo -->
          <button class="icon-btn" id="newUsecaseBtn" title="Novo usecase" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <polyline points="14 2 14 8 20 8" />
              <line x1="12" y1="18" x2="12" y2="12" />
              <line x1="9" y1="15" x2="15" y2="15" />
            </svg>
          </button>
          <!-- Novo microserviço -->
          <button class="icon-btn" id="newServiceBtn" title="Novo microserviço" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path
                d="M3 7a2 2 0 0 1 2-2h3.586a1 1 0 0 1 .707.293L10.414 6.4A1 1 0 0 0 11.121 6.7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
              <line x1="12" y1="11" x2="12" y2="17" />
              <line x1="9" y1="14" x2="15" y2="14" />
            </svg>
          </button>
          <!-- Atualizar workspace -->
          <button class="icon-btn" id="refreshWorkspaceBtn" title="Atualizar workspace" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="23 4 23 10 17 10" />
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
            </svg>
          </button>
          <!-- Abrir pasta -->
          <button class="icon-btn" id="openWorkspaceBtn" title="Abrir pasta como workspace">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path
                d="M3 7a2 2 0 0 1 2-2h3.586a1 1 0 0 1 .707.293L10.414 6.4A1 1 0 0 0 11.121 6.7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" />
            </svg>
          </button>
          <!-- Recolher painel -->
          <button class="icon-btn icon-btn--text" id="collapseWorkspaceBtn" title="Recolher workspace">▾</button>
        </div>
      </div>

      <div class="ws-tree" id="workspaceTree" aria-label="Árvore de arquivos do workspace"></div>

    </div>
    <!-- /ws-panel -->

    <!-- ─── Divider: resize workspace ↔ editor ─── -->
    <div class="ws-divider" id="wsDivider" role="separator" aria-label="Arraste para redimensionar"></div>

    <!-- ─── Editor panel ─── -->
    <div class="sidebar-panel">

      <!-- Breadcrumb do arquivo atual -->
      <div class="editor-breadcrumb" id="editorBreadcrumb" aria-label="Caminho do arquivo"></div>

      <label class="editor-label" for="rulesSource">Rules YAML</label>

      <div class="editor-frame" id="editorFrame">
        <pre class="editor-lines" id="editorLineNumbers" aria-hidden="true">1</pre>
        <textarea id="rulesSource" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off"
          aria-label="Editor YAML"></textarea>
      </div>

      <div class="editor-lint" id="editorLint" role="status">Validando YAML...</div>

      <footer class="sidebar-footer">
        <span id="editorStats">0 linhas</span>
        <div class="sidebar-actions">
          <input id="scriptFileInput" type="file" accept=".yaml,.yml,text/yaml,text/plain" hidden />
          <button class="text-button" id="importScript" type="button">Carregar</button>
          <button class="text-button" id="exportScript" type="button">.yaml</button>
          <button class="text-button" id="restoreExample" type="button">Exemplo</button>
          <button class="text-button" id="saveFileBtn" type="button">Salvar</button>
          <button class="text-button text-button--primary" id="renderRules" type="button">Renderizar</button>
        </div>
      </footer>

    </div>
    <!-- /sidebar-panel -->

    <div class="sidebar-rail"></div>
  </aside>

  <!-- ═══════════════════════════════════════════════
     PREVIEW
     ═══════════════════════════════════════════════ -->
  <main class="studio-preview">

    <header class="preview-toolbar">
      <div>
        <p class="eyebrow">Execução</p>
        <h2 id="rulesTitle">Simulador</h2>
      </div>
      <div class="preview-actions">
        <button class="tool-button" id="toggleTheme" type="button">Light</button>
        <button class="tool-button" id="setSerial" type="button">Serial</button>
        <button class="tool-button" id="setEngine" type="button">Backend</button>
      </div>
    </header>

    <section class="viewer-shell" aria-label="Simulador de regras">
      <div id="viewer"></div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════
     BOOTSTRAP
     ═══════════════════════════════════════════════ -->
  <script>
    const studioParams = new URLSearchParams(window.location.search);
    const configuredEngine = studioParams.get('engine') || localStorage.getItem('PROCESS_ENGINE_URL');
    const configuredSerial = studioParams.get('serial') || sessionStorage.getItem('PROCESS_ENGINE_SERIAL');

    window.PROCESS_ENGINE_URL = configuredEngine || 'https://rules.raysouz.studio';
    window.PROCESS_ENGINE_PROMPT_SERIAL = true;

    if (studioParams.get('engine')) {
      localStorage.setItem('PROCESS_ENGINE_URL', studioParams.get('engine'));
    }
    if (configuredSerial) {
      window.PROCESS_ENGINE_SERIAL = configuredSerial;
      sessionStorage.setItem('PROCESS_ENGINE_SERIAL', configuredSerial);
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="../plugin/process-plugin.js"></script>
  <!-- Studio: ordem de carregamento importa (fundação → domínios) -->
  <script src="./studio.js"></script>
  <script src="./studio.workspace.js"></script>
  <script src="./studio.script-editor.js"></script>
  <script src="./studio.preview.js"></script>

</body>

</html>
