id: "10000000-0000-4000-a000-000000000001"
name: Criar pedido
description: |
  Exemplo de usecase no microservico pedidos. Ele valida um pedido e
  encaminha o resultado para o microservico pagamentos.

input:
  order_id:
    type: string
    label: "Pedido"
    description: "Identificador do pedido criado no checkout."
    example: "ORD-1001"
  customer_id:
    type: string
    label: "Cliente"
    description: "Identificador do cliente comprador."
    example: "CUS-900"
  amount:
    type: number
    label: "Total"
    description: "Valor total do pedido."
    example: 349.90

steps:
  - name: Validar Pedido
    condition: "input.order_id != '' && input.customer_id != '' && input.amount > 0.0"
    on_fail:
      action: ABORT
      message: "Pedido invalido para pagamento"

  - name: Preparar Pedido
    assign: pedido
    compute:
      - name: order_id
        expr: "input.order_id"
      - name: customer_id
        expr: "input.customer_id"
      - name: amount
        expr: "input.amount"
      - name: currency
        expr: "'BRL'"

  - name: Resultado do Pedido
    result:
      - name: order_id
        expr: "pedido.order_id"
      - name: customer_id
        expr: "pedido.customer_id"
      - name: amount
        expr: "pedido.amount"
      - name: currency
        expr: "pedido.currency"
      - name: status
        expr: "'ORDER_READY_FOR_PAYMENT'"

links:
  - service: pagamentos
    usecase: autorizar-pagamento.yaml
    input:
      order_id: "result.order_id"
      customer_id: "result.customer_id"
      amount: "result.amount"
      currency: "result.currency"
