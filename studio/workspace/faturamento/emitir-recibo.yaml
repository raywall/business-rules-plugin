id: "10000000-0000-4000-a000-000000000003"
name: Emitir recibo
description: |
  Exemplo de usecase no microservico faturamento. Recebe a autorizacao de
  pagamento e emite um recibo para finalizar a esteira do pedido.

input:
  order_id:
    type: string
    label: "Pedido"
    description: "Pedido pago que tera o recibo emitido."
    example: "ORD-1001"
  customer_id:
    type: string
    label: "Cliente"
    description: "Cliente associado ao pedido pago."
    example: "CUS-900"
  authorization_id:
    type: string
    label: "Autorizacao"
    description: "Identificador retornado pelo gateway de pagamento."
    example: "PAY-777"
  amount:
    type: number
    label: "Valor"
    description: "Valor autorizado para emissao do recibo."
    example: 349.90

mocks:
  receipt:
    source: "POST /billing/receipts"
    data:
      receipt_id: "REC-2026-0001"
      status: "ISSUED"
      channel: "email"

steps:
  - name: Validar Autorizacao
    condition: "input.order_id != '' && input.customer_id != '' && input.authorization_id != '' && input.amount > 0.0"
    on_fail:
      action: ABORT
      message: "Dados insuficientes para emitir recibo"

  - name: Emitir Recibo
    use_mock: receipt
    assign: receipt
    condition: "receipt.status == 'ISSUED'"
    on_fail:
      action: ABORT
      message: "Recibo nao emitido"

  - name: Resultado do Faturamento
    result:
      - name: order_id
        expr: "input.order_id"
      - name: customer_id
        expr: "input.customer_id"
      - name: billing_status
        expr: "'RECEIPT_ISSUED'"
      - name: receipt_id
        expr: "receipt.receipt_id"
      - name: amount
        expr: "input.amount"
