name: docs

on:
  workflow_run:
    workflows:
      - release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: gerar pages
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: baixar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: configurar github pages
        uses: actions/configure-pages@v5

      - name: validar assets do studio
        shell: bash
        run: |
          test -f index.html
          test -f studio/index.html
          test -f studio/studio.js
          test -f studio/style.css
          test -f plugin/process-plugin.js
          test -f plugin/process-plugin.css

      - name: montar artefato
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp index.html pages-dist/index.html
          cp -R studio pages-dist/studio
          cp -R plugin pages-dist/plugin
          touch pages-dist/.nojekyll

      - name: enviar artefato do pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: configurar aws
        if: ${{ vars.STUDIO_S3_BUCKET != '' && vars.STUDIO_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STUDIO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: publicar studio same-origin
        if: ${{ vars.STUDIO_S3_BUCKET != '' && vars.STUDIO_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        shell: bash
        run: |
          aws s3 sync pages-dist "s3://${{ vars.STUDIO_S3_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.STUDIO_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/studio/*" "/plugin/*" "/index.html"

  deploy:
    name: publicar pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: publicar no github pages
        id: deployment
        uses: actions/deploy-pages@v4
