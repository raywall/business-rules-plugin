name: docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: gerar pages
    runs-on: ubuntu-latest

    steps:
      - name: baixar codigo
        uses: actions/checkout@v4

      - name: configurar github pages
        uses: actions/configure-pages@v5

      - name: validar assets do studio
        shell: bash
        run: |
          test -f index.html
          test -f studio/index.html
          test -f studio/studio.js
          test -f studio/style.css
          test -f plugin/process-plugin.js
          test -f plugin/process-plugin.css

      - name: montar artefato
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp index.html pages-dist/index.html
          cp -R studio pages-dist/studio
          cp -R plugin pages-dist/plugin
          touch pages-dist/.nojekyll

      - name: enviar artefato do pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    name: publicar pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: publicar no github pages
        id: deployment
        uses: actions/deploy-pages@v4
